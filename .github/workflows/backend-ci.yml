name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - "scripts/validate_database.sh"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "database/**"
      - "scripts/validate_database.sh"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: spritedex
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spritedex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spritedex
      PYTHONPATH: backend
      # Test-only material. Production values must be stored outside Git.
      SPRITEDEX_JWT_SECRET: ci-only-not-a-production-secret-change-me-0123456789
      SPRITEDEX_TOKEN_ENCRYPTION_KEY: WEPWUnjBBtNBFFrMnFckIoHBDR6eH1iv4P8E6veOIzM=
      INAT_CLIENT_ID: test-client-id
      INAT_CLIENT_SECRET: test-client-secret
      INAT_REDIRECT_URI: http://testserver/api/inaturalist/callback

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare database
        run: bash scripts/validate_database.sh

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest -q backend/tests
